version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: optiveil_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - optiveil_network

  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: optiveil_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - optiveil_network

  frontend:
    build:
      context: ./frontend
    container_name: optiveil_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - optiveil_network

volumes:
  postgres_data:

networks:
  optiveil_network:
    driver: bridge